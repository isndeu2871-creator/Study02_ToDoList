<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 관리</title>
<style>
  :root {
    color-scheme: light;
    --배경: #f4f5f7;
    --카드: #ffffff;
    --글자: #1f2430;
    --흐린글자: #8a90a0;
    --선: #e3e5ea;
    --주색: #3b6cf6;
    --업무: #3b6cf6;
    --개인: #e8833a;
    --공부: #2fa56b;
  }
  /* 다크 모드: 단추로 고르면 data-theme 이 붙고, 고른 적이 없으면 시스템 설정을 따른다. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --배경: #14161c;
    --카드: #1d2029;
    --글자: #e8eaf0;
    --흐린글자: #7d8396;
    --선: #2b2f3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --배경: #14161c;
      --카드: #1d2029;
      --글자: #e8eaf0;
      --흐린글자: #7d8396;
      --선: #2b2f3b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--배경);
    color: var(--글자);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; }
  .머리 { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  .도구 { display: flex; gap: 8px; flex-wrap: wrap; }
  .도구 button.보조 { padding: 6px 12px; color: var(--글자); }

  .카드 {
    background: var(--카드);
    border: 1px solid var(--선);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }

  .진행률글자 { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
  .진행률막대 { height: 10px; background: var(--선); border-radius: 5px; overflow: hidden; }
  .진행률막대 > div { height: 100%; width: 0; background: var(--주색); transition: width .25s; }

  .탭줄 { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .탭 {
    border: 1px solid var(--선);
    background: var(--카드);
    color: var(--글자);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  .탭[aria-pressed="true"] { background: var(--주색); border-color: var(--주색); color: #fff; }

  form.입력줄 { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type="text"], select {
    font: inherit;
    color: var(--글자);
    background: var(--배경);
    border: 1px solid var(--선);
    border-radius: 8px;
    padding: 8px 10px;
  }
  form.입력줄 input[type="text"] { flex: 1 1 200px; min-width: 0; }
  button {
    font: inherit;
    border: 0;
    border-radius: 8px;
    padding: 8px 14px;
    background: var(--주색);
    color: #fff;
    cursor: pointer;
  }
  button.보조 { background: transparent; color: var(--흐린글자); border: 1px solid var(--선); padding: 4px 10px; font-size: 13px; }
  button.보조:hover { color: var(--글자); }
  :focus-visible { outline: 2px solid var(--주색); outline-offset: 2px; }

  ul { list-style: none; margin: 0; padding: 0; }
  li.항목 {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--선);
  }
  li.항목:last-child { border-bottom: 0; }
  li.항목 input[type="checkbox"] { width: 18px; height: 18px; flex: none; }
  .내용 { flex: 1; min-width: 0; word-break: break-word; cursor: text; }
  li.완료 .내용 { text-decoration: line-through; color: var(--흐린글자); }
  .배지 { font-size: 12px; color: #fff; padding: 2px 8px; border-radius: 999px; flex: none; }
  .배지.업무 { background: var(--업무); }
  .배지.개인 { background: var(--개인); }
  .배지.공부 { background: var(--공부); }
  li.수정중 { flex-wrap: wrap; }
  li.수정중 input[type="text"] { flex: 1 1 160px; min-width: 0; }

  /* 좁은 화면은 한 줄 배치(사이드가 위, 목록이 아래), 넓은 화면은 2단 */
  .화면 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
  /* 모바일 모드: 창이 넓어도 좁은 한 줄 배치로 보여 준다. */
  :root[data-layout="mobile"] main { max-width: 480px; }
  /* 웹 모드: 창이 넓을 때만 2단. 좁은 창에서는 한 줄로 내려간다. */
  @media (min-width: 900px) {
    :root:not([data-layout="mobile"]) body { padding-top: 40px; }
    :root:not([data-layout="mobile"]) .화면 { grid-template-columns: 340px minmax(0, 1fr); gap: 24px; align-items: start; }
    :root:not([data-layout="mobile"]) .사이드 { position: sticky; top: 24px; }
    :root:not([data-layout="mobile"]) .목록카드 { min-height: 480px; }
  }

  .빈목록 { text-align: center; color: var(--흐린글자); padding: 24px 0; }
  .아래줄 { display: flex; justify-content: flex-end; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <header class="머리">
    <h1>할 일 관리</h1>
    <div class="도구">
      <button type="button" class="보조" id="레이아웃버튼"></button>
      <button type="button" class="보조" id="테마버튼"></button>
    </div>
  </header>

  <div class="화면">
  <aside class="사이드">
  <section class="카드" aria-label="진행률">
    <div class="진행률글자">
      <span id="진행률글자"></span>
      <span id="구분진행률글자"></span>
    </div>
    <div class="진행률막대" role="progressbar" aria-label="전체 진행률" aria-valuemin="0" aria-valuemax="100" id="진행률막대">
      <div id="진행률채움"></div>
    </div>
  </section>

  <div class="탭줄" id="탭줄" role="group" aria-label="카테고리 탭"></div>

  <form class="카드 입력줄" id="입력폼">
    <input type="text" id="새내용" placeholder="할 일을 입력하세요" aria-label="새 할 일" autocomplete="off">
    <select id="새분류" aria-label="카테고리"></select>
    <button type="submit">추가</button>
  </form>
  </aside>

  <section class="카드 목록카드" aria-label="할 일 목록">
    <ul id="목록"></ul>
    <div class="아래줄"><button type="button" class="보조" id="완료삭제">완료 항목 지우기</button></div>
  </section>
  </div>
</main>

<script>
  // ---------- 상수 ----------
  const 저장키 = "todoApp.v1";
  const 이전저장키 = "todos"; // 이전 형식(배열). 새 키가 비어 있을 때만 한 번 읽어 와서 옮긴다.
  const 분류들 = ["업무", "개인", "공부"];

  // ---------- 상태 ----------
  let 할일들 = 불러오기();
  let 수정중아이디 = null; // 한 번에 한 항목만 수정한다
  let 현재탭 = "전체";

  // ---------- 1. 저장·불러오기 ----------
  // 저장 형식은 { version: 1, todos: [...] } 이다.
  function 원본목록읽기() {
    const 새값 = JSON.parse(localStorage.getItem(저장키));
    if (새값 && 새값.version === 1 && Array.isArray(새값.todos)) return 새값.todos;
    if (새값 !== null) return []; // 새 키가 있는데 형식이 낯설면 빈 목록으로 시작한다.
    const 옛값 = JSON.parse(localStorage.getItem(이전저장키));
    return Array.isArray(옛값) ? 옛값 : [];
  }

  // 값이 없거나 JSON 이 깨졌거나 형식이 맞지 않으면 빈 목록으로 시작한다.
  function 불러오기() {
    try {
      const 원본 = 원본목록읽기();
      // 필드가 맞지 않는 항목은 버리고, 카테고리가 없거나 낯선 값이면 "업무"로 보정한다.
      return 원본
        .filter(항목 =>
          항목 && typeof 항목.id === "string" && typeof 항목.text === "string" &&
          typeof 항목.done === "boolean"
        )
        .map(항목 => ({ ...항목, category: 분류들.includes(항목.category) ? 항목.category : 분류들[0] }));
    } catch (오류) {
      return [];
    }
  }

  // 저장소를 쓸 수 없는 환경(사생활 보호 모드 등)에서는 메모리에서만 동작한다.
  function 저장하기() {
    try {
      localStorage.setItem(저장키, JSON.stringify({ version: 1, todos: 할일들 }));
    } catch (오류) {
      // 무시
    }
  }

  // ---------- 보기 설정 (웹/모바일 모드, 라이트/다크 모드) ----------
  // 할 일 데이터와는 별도 키에 저장한다. theme 이 null 이면 시스템 설정을 따른다.
  const 설정키 = "todoApp.view";
  let 보기 = 보기설정읽기();

  function 보기설정읽기() {
    try {
      const 원본 = JSON.parse(localStorage.getItem(설정키));
      return {
        layout: 원본 && 원본.layout === "mobile" ? "mobile" : "web",
        theme: 원본 && (원본.theme === "light" || 원본.theme === "dark") ? 원본.theme : null,
      };
    } catch (오류) {
      return { layout: "web", theme: null };
    }
  }

  function 보기설정저장() {
    try {
      localStorage.setItem(설정키, JSON.stringify(보기));
    } catch (오류) {
      // 무시
    }
  }

  function 현재테마() {
    if (보기.theme) return 보기.theme;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  function 보기적용() {
    const 루트 = document.documentElement;
    루트.dataset.layout = 보기.layout;
    if (보기.theme) 루트.dataset.theme = 보기.theme;
    else delete 루트.dataset.theme;
    document.getElementById("레이아웃버튼").textContent = 보기.layout === "web" ? "모바일 모드로" : "웹 모드로";
    document.getElementById("테마버튼").textContent = 현재테마() === "dark" ? "라이트 모드로" : "다크 모드로";
  }

  // ---------- 2. 상태 변경 ----------
  // 모든 변경은 변경됨() 을 거쳐 저장하고 다시 그린다.
  function 새아이디() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8) +
      (새아이디.순번 = (새아이디.순번 || 0) + 1).toString(36);
  }

  function 추가하기(내용, 분류) {
    const 정리 = 내용.trim();
    if (!정리) return false;
    할일들.push({ id: 새아이디(), text: 정리, category: 분류, done: false, createdAt: Date.now() });
    변경됨();
    return true;
  }

  // id, done, createdAt 은 건드리지 않고 내용과 카테고리만 바꾼다.
  function 수정하기(아이디, 내용, 분류) {
    const 정리 = 내용.trim();
    if (!정리) return false;
    const 항목 = 할일들.find(x => x.id === 아이디);
    if (!항목) return false;
    항목.text = 정리;
    항목.category = 분류;
    변경됨();
    return true;
  }

  function 삭제하기(아이디) {
    if (!confirm("이 할 일을 삭제할까요?")) return;
    할일들 = 할일들.filter(x => x.id !== 아이디);
    if (수정중아이디 === 아이디) 수정중아이디 = null;
    변경됨();
  }

  function 완료바꾸기(아이디) {
    const 항목 = 할일들.find(x => x.id === 아이디);
    if (!항목) return;
    항목.done = !항목.done;
    변경됨();
  }

  function 완료지우기() {
    const 개수 = 할일들.filter(x => x.done).length;
    if (개수 === 0) return;
    if (!confirm(`완료한 ${개수}개를 지울까요?`)) return;
    할일들 = 할일들.filter(x => !x.done);
    if (!할일들.some(x => x.id === 수정중아이디)) 수정중아이디 = null;
    변경됨();
  }

  // 목록을 받아 { 전체, 완료, 퍼센트 } 를 돌려준다. 0개면 0%.
  // 반올림은 Math.round 대신 floor(x + 0.5) 를 쓴다.
  function 진행률계산(목록) {
    const 전체 = 목록.length;
    const 완료 = 목록.filter(x => x.done).length;
    const 퍼센트 = 전체 === 0 ? 0 : Math.floor(완료 / 전체 * 100 + 0.5);
    return { 전체, 완료, 퍼센트 };
  }

  function 변경됨() {
    저장하기();
    그리기();
  }

  // ---------- 3. 화면 그리기 ----------
  // 사용자 입력은 textContent 로만 넣는다.
  function 만들기(태그, 속성 = {}, 글자 = "") {
    const 요소 = document.createElement(태그);
    for (const [키, 값] of Object.entries(속성)) {
      if (키 === "class") 요소.className = 값;
      else 요소.setAttribute(키, 값);
    }
    if (글자) 요소.textContent = 글자;
    return 요소;
  }

  function 그리기() {
    // 진행률 (전체)
    const 전체값 = 진행률계산(할일들);
    document.getElementById("진행률글자").textContent =
      `완료 ${전체값.완료} / 전체 ${전체값.전체} (${전체값.퍼센트}%)`;
    document.getElementById("진행률채움").style.width = 전체값.퍼센트 + "%";
    document.getElementById("진행률막대").setAttribute("aria-valuenow", 전체값.퍼센트);

    // 필터는 화면에만 적용한다. 저장된 데이터는 그대로다.
    const 보이는목록 = 현재탭 === "전체" ? 할일들 : 할일들.filter(x => x.category === 현재탭);

    // 진행률 (선택한 탭)
    const 탭값 = 진행률계산(보이는목록);
    document.getElementById("구분진행률글자").textContent =
      현재탭 === "전체" ? "" : `${현재탭} ${탭값.완료}/${탭값.전체} (${탭값.퍼센트}%)`;

    // 탭
    const 탭줄 = document.getElementById("탭줄");
    탭줄.replaceChildren();
    for (const 이름 of ["전체", ...분류들]) {
      const 탭 = 만들기("button", { type: "button", class: "탭", "aria-pressed": String(이름 === 현재탭) }, 이름);
      탭.addEventListener("click", () => { 현재탭 = 이름; 수정중아이디 = null; 그리기(); });
      탭줄.appendChild(탭);
    }

    // 목록
    const 목록 = document.getElementById("목록");
    목록.replaceChildren();
    if (보이는목록.length === 0) {
      목록.appendChild(만들기("li", { class: "빈목록" }, "할 일이 없습니다"));
      return;
    }
    for (const 항목 of 보이는목록) {
      목록.appendChild(항목.id === 수정중아이디 ? 수정줄만들기(항목) : 보기줄만들기(항목));
    }
  }

  function 분류선택칸만들기(선택값) {
    const 칸 = 만들기("select", { "aria-label": "카테고리" });
    for (const 분류 of 분류들) {
      const 옵션 = 만들기("option", { value: 분류 }, 분류);
      if (분류 === 선택값) 옵션.selected = true;
      칸.appendChild(옵션);
    }
    return 칸;
  }

  function 보기줄만들기(항목) {
    const 줄 = 만들기("li", { class: "항목" + (항목.done ? " 완료" : "") });

    const 체크 = 만들기("input", { type: "checkbox", "aria-label": "완료 표시" });
    체크.checked = 항목.done;
    체크.addEventListener("change", () => 완료바꾸기(항목.id));

    const 내용 = 만들기("span", { class: "내용" }, 항목.text);
    내용.addEventListener("dblclick", () => 수정시작(항목.id));

    const 배지 = 만들기("span", { class: "배지 " + 항목.category }, 항목.category);
    const 수정 = 만들기("button", { type: "button", class: "보조", "aria-label": "수정" }, "수정");
    수정.addEventListener("click", () => 수정시작(항목.id));
    const 삭제 = 만들기("button", { type: "button", class: "보조", "aria-label": "삭제" }, "삭제");
    삭제.addEventListener("click", () => 삭제하기(항목.id));

    줄.append(체크, 내용, 배지, 수정, 삭제);
    return 줄;
  }

  function 수정줄만들기(항목) {
    const 줄 = 만들기("li", { class: "항목 수정중" });
    const 입력 = 만들기("input", { type: "text", "aria-label": "할 일 수정", autocomplete: "off" });
    입력.value = 항목.text;
    const 분류칸 = 분류선택칸만들기(항목.category);

    // 빈 내용이면 저장하지 않고 수정 상태를 유지한다.
    const 저장 = () => {
      if (수정하기(항목.id, 입력.value, 분류칸.value)) 수정중아이디 = null;
      그리기();
    };
    const 취소 = () => { 수정중아이디 = null; 그리기(); };

    입력.addEventListener("keydown", (이벤트) => {
      if (이벤트.key === "Enter") { 이벤트.preventDefault(); 저장(); }
      else if (이벤트.key === "Escape") 취소();
    });

    const 저장버튼 = 만들기("button", { type: "button" }, "저장");
    저장버튼.addEventListener("click", 저장);
    const 취소버튼 = 만들기("button", { type: "button", class: "보조" }, "취소");
    취소버튼.addEventListener("click", 취소);

    줄.append(입력, 분류칸, 저장버튼, 취소버튼);
    queueMicrotask(() => 입력.focus());
    return 줄;
  }

  function 수정시작(아이디) {
    수정중아이디 = 아이디;
    그리기();
  }

  // ---------- 4. 이벤트 연결 ----------
  const 새분류칸 = document.getElementById("새분류");
  for (const 분류 of 분류들) 새분류칸.appendChild(만들기("option", { value: 분류 }, 분류));

  document.getElementById("완료삭제").addEventListener("click", 완료지우기);

  document.getElementById("레이아웃버튼").addEventListener("click", () => {
    보기.layout = 보기.layout === "web" ? "mobile" : "web";
    보기설정저장();
    보기적용();
  });
  document.getElementById("테마버튼").addEventListener("click", () => {
    보기.theme = 현재테마() === "dark" ? "light" : "dark";
    보기설정저장();
    보기적용();
  });
  // 고른 적이 없으면 시스템 설정이 바뀔 때 단추 글자도 따라 바뀐다.
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", 보기적용);

  document.getElementById("입력폼").addEventListener("submit", (이벤트) => {
    이벤트.preventDefault();
    const 입력 = document.getElementById("새내용");
    if (추가하기(입력.value, 새분류칸.value)) 입력.value = "";
    입력.focus();
  });

  보기적용();
  그리기();
</script>
</body>
</html>
